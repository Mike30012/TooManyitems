name: Build TooManyItems2

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Projekt vorbereiten
        run: |
          if [ ! -f TooManyItems2.zip ]; then
            echo "FEHLER: TooManyItems2.zip fehlt im Repo"
            ls -la
            exit 1
          fi
          mkdir -p work
          unzip -o TooManyItems2.zip -d work
          B=$(find work -name build.gradle | head -1)
          if [ -z "$B" ]; then
            echo "FEHLER: kein build.gradle in der ZIP"
            find work | head -50
            exit 1
          fi
          echo "PROJ=$(dirname "$B")" >> "$GITHUB_ENV"

      - name: Bauen
        run: |
          cd "$PROJ"
          gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TooManyItems2-jar
          path: work/**/build/libs/TooManyItems2-*.jar
