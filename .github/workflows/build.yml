
name: Build TooManyItems2

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 21 installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: ZIP-Projekt vorbereiten
        run: |
          Z=$(find . -maxdepth 1 -name '*.zip' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)

          if [ -z "$Z" ]; then
            echo "FEHLER: Keine ZIP im Repository gefunden!"
            ls -la
            exit 1
          fi

          echo "Verwende: $Z"

          mkdir -p work
          unzip -o "$Z" -d work

          B=$(find work -name build.gradle -print -quit)

          if [ -z "$B" ]; then
            echo "FEHLER: Keine build.gradle gefunden!"
            find work -maxdepth 4 -type f
            exit 1
          fi

          PROJ=$(dirname "$B")
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"

          echo "Projekt gefunden: $PROJ"
          ls -la "$PROJ"

      - name: Mod bauen
        run: |
          cd "$PROJ"
          gradle build --no-daemon

      - name: Gebaute JAR anzeigen
        run: |
          echo "Gefundene JAR-Dateien:"
          find "$PROJ/build/libs" -maxdepth 1 -name '*.jar' -type f

      - name: NeoForge Mod herunterladen
        uses: actions/upload-artifact@v4
        with:
          name: TooManyItems2-NeoForge-1.21.1
          path: ${{ env.PROJ }}/build/libs/*.jar
          if-no-files-found: error
          compression-level: 6
