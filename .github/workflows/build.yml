name: Build TooManyItems2

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Projekt vorbereiten
        run: |
          mkdir -p work
          if [ -f TooManyItems2.zip ]; then
            unzip -o TooManyItems2.zip -d work
          else
            rsync -a --exclude work --exclude .git ./ work/
          fi

      - name: Bauen
        working-directory: work
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TooManyItems2-jar
          path: work/build/libs/TooManyItems2-*.jar
